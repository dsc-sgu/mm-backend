name: test
on: [ pull_request ]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run tests
        run: go test ./cmd/... ./internal/...  ./pkg/... -v
  integration-test:
    runs-on: ubuntu-latest
    name: Integration tests
    services:
      dind:
        image: docker:28.0.4-dind-rootless
        ports:
          - 2375:2375
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test with Docker
        run: go test -v ./tests/...
