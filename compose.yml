services:
  backend:
    image: mm-backend:latest
    build: .
    command: ["/app/server"]
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - postgres
      - dragonfly
    env_file:
      - path: .env
        required: false
  postgres:
    image: postgres:18.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - type: bind
        source: ./db/CreateTables.sql
        target: /docker-entrypoint-initdb.d/CreateTables.sql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "1301:5432"
    env_file:
      - path: .env
        required: false

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "1302:6379"
    env_file:
      - path: .env
        required: false
